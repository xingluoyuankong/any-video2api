# Nginx 反向代理配置（实测部署版本）
#
# 部署位置：/etc/nginx/sites-available/any-video2api
# 启用：    sudo ln -sf /etc/nginx/sites-available/any-video2api /etc/nginx/sites-enabled/
#
# 80 端口直连（对公网开放时可用）；
# 443 保留 SSL（防火墙开放 443 或走 Cloudflare 隧道后生效）。

server {
    listen 80;
    listen [::]:80;
    server_name video.example.com 52-64-8-93.sslip.io;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 1800s;   # 视频任务轮询较久
        proxy_buffering off;        # SSE / 流式友好
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name video.example.com 52-64-8-93.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }
}
